<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">交互式答题网页功能概览</title><desc id="desc">即时判分、三段解析、知识点筛选、本机进度保存、图表放大与手机适配。作答后按判分、解析、复习的顺序使用。</desc>
<rect width="1200" height="790" rx="24" fill="#f5f7fb"/>
<g font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,Arial,sans-serif">
<text x="44" y="58" font-size="15" font-weight="700" fill="#68758a" letter-spacing="2">QUIZ WEB PRACTICE</text>
<text x="44" y="105" font-size="32" font-weight="700" fill="#202c40">答题与复习功能一览</text>
<text x="44" y="139" font-size="18" fill="#6c778a">离线打开即可练习 · 无需安装 · 进度保存在本机浏览器</text>
<rect x="44" y="177" width="356" height="208" rx="17" fill="#fff" stroke="#e3e8f0"/>
<rect x="66" y="199" width="46" height="46" rx="13" fill="#eef0ff"/>
<g transform="translate(75,208)" stroke="#4f5bd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M5 12l5 5L21 6"/></g>
<text x="66" y="281" font-size="22" font-weight="700" fill="#243047">整行点选，即时判分</text>
<text x="66" y="319" font-size="16" fill="#68758a">点击选项任意位置，立即查看正误。</text>
<text x="66" y="348" font-size="16" fill="#68758a">文字仍可拖选复制，不会误触作答。</text>
<rect x="422" y="177" width="356" height="208" rx="17" fill="#fff" stroke="#e3e8f0"/>
<rect x="444" y="199" width="46" height="46" rx="13" fill="#e9f6ef"/>
<g transform="translate(453,208)" stroke="#168265" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M4 4h7a4 4 0 0 1 4 4v14a4 4 0 0 0-4-4H4zM15 8a4 4 0 0 1 4-4h5v14h-5a4 4 0 0 0-4 4"/></g>
<text x="444" y="281" font-size="22" font-weight="700" fill="#243047">三段解析，读懂每一题</text>
<text x="444" y="319" font-size="16" fill="#68758a">题意分析 → 选项解析 → 知识总结</text>
<text x="444" y="348" font-size="16" fill="#68758a">名称后用绿勾、红叉提示应选项。</text>
<rect x="800" y="177" width="356" height="208" rx="17" fill="#fff" stroke="#e3e8f0"/>
<rect x="822" y="199" width="46" height="46" rx="13" fill="#fcf4e6"/>
<g transform="translate(831,208)" stroke="#946519" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M3 8l11-6 11 6-11 6zM3 14l11 6 11-6M3 20l11 6 11-6"/></g>
<text x="822" y="281" font-size="22" font-weight="700" fill="#243047">按知识点筛选复习</text>
<text x="822" y="319" font-size="16" fill="#68758a">分类可结合未作答、答错、答对。</text>
<text x="822" y="348" font-size="16" fill="#68758a">顶部统计随作答更新，查看进度。</text>
<rect x="44" y="407" width="356" height="208" rx="17" fill="#fff" stroke="#e3e8f0"/>
<rect x="66" y="429" width="46" height="46" rx="13" fill="#edf2fa"/>
<g transform="translate(75,438)" stroke="#51678d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M5 3h15l5 5v17H3V3zM8 3v8h11V3M8 25V16h12v9"/></g>
<text x="66" y="511" font-size="22" font-weight="700" fill="#243047">关掉再开，继续练习</text>
<text x="66" y="549" font-size="16" fill="#68758a">进度自动保存在当前浏览器。</text>
<text x="66" y="578" font-size="16" fill="#68758a">清空前再次确认，避免误删记录。</text>
<rect x="422" y="407" width="356" height="208" rx="17" fill="#fff" stroke="#e3e8f0"/>
<rect x="444" y="429" width="46" height="46" rx="13" fill="#f5eef8"/>
<g transform="translate(453,438)" stroke="#8b5898" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="11" cy="11" r="8"/><path d="M17 17l9 9M7 11h8M11 7v8"/></g>
<text x="444" y="511" font-size="22" font-weight="700" fill="#243047">原题图表，一点放大</text>
<text x="444" y="549" font-size="16" fill="#68758a">图表直接放在题目旁，方便对照。</text>
<text x="444" y="578" font-size="16" fill="#68758a">全部嵌入文件，断网也能查看。</text>
<rect x="800" y="407" width="356" height="208" rx="17" fill="#fff" stroke="#e3e8f0"/>
<rect x="822" y="429" width="46" height="46" rx="13" fill="#eaf5f8"/>
<g transform="translate(831,438)" stroke="#327e98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="6" y="2" width="16" height="25" rx="3"/><path d="M11 6h6M12 23h4"/></g>
<text x="822" y="511" font-size="22" font-weight="700" fill="#243047">手机可用，快速跳题</text>
<text x="822" y="549" font-size="16" fill="#68758a">手机自动排版，输入题号直达。</text>
<text x="822" y="578" font-size="16" fill="#68758a">也可用 Tab、Enter 和空格操作。</text>
<rect x="44" y="656" width="1112" height="91" rx="16" fill="#eaf0f9"/>
<circle cx="90" cy="700" r="18" fill="#fff"/>
<text x="90" y="706" text-anchor="middle" font-size="16" font-weight="700" fill="#4f5bd5">1</text>
<text x="121" y="707" font-size="20" font-weight="600" fill="#36445b">点击选项</text>
<path d="M292 700h20m-6-6l6 6-6 6" stroke="#8d9cb2" stroke-width="2" fill="none" stroke-linecap="round"/>
<circle cx="368" cy="700" r="18" fill="#fff"/>
<text x="368" y="706" text-anchor="middle" font-size="16" font-weight="700" fill="#4f5bd5">2</text>
<text x="399" y="707" font-size="20" font-weight="600" fill="#36445b">即时判分</text>
<path d="M570 700h20m-6-6l6 6-6 6" stroke="#8d9cb2" stroke-width="2" fill="none" stroke-linecap="round"/>
<circle cx="646" cy="700" r="18" fill="#fff"/>
<text x="646" y="706" text-anchor="middle" font-size="16" font-weight="700" fill="#4f5bd5">3</text>
<text x="677" y="707" font-size="20" font-weight="600" fill="#36445b">阅读解析</text>
<path d="M848 700h20m-6-6l6 6-6 6" stroke="#8d9cb2" stroke-width="2" fill="none" stroke-linecap="round"/>
<circle cx="924" cy="700" r="18" fill="#fff"/>
<text x="924" y="706" text-anchor="middle" font-size="16" font-weight="700" fill="#4f5bd5">4</text>
<text x="955" y="707" font-size="20" font-weight="600" fill="#36445b">筛选复习</text>
</g></svg>
